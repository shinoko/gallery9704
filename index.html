<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALLERY9704</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="filter-backdrop" id="filterBackdrop" aria-hidden="true"></div>
    <div class="toast-viewport" id="toastViewport" aria-live="polite" aria-atomic="true"></div>
    <nav class="nav">
        <div class="nav-inner">
            <span class="nav-brand">GALLERY9704</span>
            <div class="nav-actions">
                <div class="data-tabs" role="tablist" aria-label="数据类型">
                    <button class="data-tab official-tab active" id="officialTab" type="button" role="tab" aria-selected="true" title="官方" aria-label="官方">
                        <span class="official-icon" aria-hidden="true"><span class="fox-mark"></span><span class="bunny-mark"></span></span>
                    </button>
                    <button class="data-tab station-tab" id="stationTab" type="button" role="tab" aria-selected="false" title="站姐" aria-label="站姐">
                        <span class="heart heart-pink" aria-hidden="true"></span><span class="heart heart-green" aria-hidden="true"></span>
                    </button>
                </div>
                <button class="nav-toggle" id="navToggle" title="筛选" aria-label="筛选" aria-pressed="false">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <line x1="2" y1="3" x2="12" y2="3"/>
                        <line x1="4" y1="7" x2="10" y2="7"/>
                        <line x1="6" y1="11" x2="8" y2="11"/>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- 筛选面板 -->
    <section class="filter-panel hidden" id="sidebar">
        <div class="filter-panel-inner">
            <div class="sidebar-header">
                <span class="sidebar-title">筛选条件</span>
                <span class="sidebar-count" id="resultCount">0 条</span>
                <button class="sidebar-close" id="sidebarClose" title="关闭">✕</button>
            </div>

            <div class="filter-section">
                <!-- 关键词 -->
                <div class="filter-group">
                    <label class="filter-label">关键词</label>
                    <div class="filter-input-wrap">
                        <input type="text" id="keywordSearch" class="filter-input" placeholder="输入关键词搜索...">
                        <button class="filter-clear" type="button" data-clear-input="keywordSearch" aria-label="清空关键词" hidden>×</button>
                    </div>
                </div>

                <!-- 活动主题 -->
                <div class="filter-group" id="themeFilterGroup">
                    <label class="filter-label">活动主题</label>
                    <div class="custom-select" data-custom-select>
                        <button class="custom-select-trigger" id="themeFilterTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                            <span class="custom-select-value" data-select-label>全部主题</span>
                            <span class="custom-select-chevron" aria-hidden="true"></span>
                        </button>
                        <div class="custom-select-menu" role="listbox" aria-label="活动主题选项" hidden></div>
                        <select id="themeFilter" class="custom-select-native" tabindex="-1" aria-hidden="true">
                            <option value="">全部主题</option>
                        </select>
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-label">发布账号</label>
                    <div class="custom-select" data-custom-select>
                        <button class="custom-select-trigger" id="authorFilterTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                            <span class="custom-select-value" data-select-label>全部账号</span>
                            <span class="custom-select-chevron" aria-hidden="true"></span>
                        </button>
                        <div class="custom-select-menu" role="listbox" aria-label="发布账号选项" hidden></div>
                        <select id="authorFilter" class="custom-select-native" tabindex="-1" aria-hidden="true">
                            <option value="">全部账号</option>
                        </select>
                    </div>
                </div>

                <div class="filter-group" id="platformFilterGroup">
                    <label class="filter-label">发布平台</label>
                    <div class="custom-select" data-custom-select>
                        <button class="custom-select-trigger" id="platformFilterTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                            <span class="custom-select-value" data-select-label>全部平台</span>
                            <span class="custom-select-chevron" aria-hidden="true"></span>
                        </button>
                        <div class="custom-select-menu" role="listbox" aria-label="发布平台选项" hidden></div>
                        <select id="platformFilter" class="custom-select-native" tabindex="-1" aria-hidden="true">
                            <option value="">全部平台</option>
                        </select>
                    </div>
                </div>

                <div class="filter-group" id="shootDateFilterGroup">
                    <label class="filter-label">拍摄时间</label>
                    <div class="date-row">
                        <div class="date-picker" data-date-picker>
                            <button class="date-picker-trigger" type="button" data-date-trigger aria-haspopup="dialog" aria-expanded="false" aria-label="拍摄开始日期">
                                <span class="date-picker-value" data-date-value>开始日期</span>
                                <span class="date-picker-icon" aria-hidden="true"></span>
                            </button>
                            <div class="date-picker-popover" role="dialog" aria-label="选择拍摄开始日期" hidden>
                                <div class="date-picker-header">
                                    <button class="date-picker-nav" type="button" data-date-prev aria-label="上个月">‹</button>
                                    <span class="date-picker-month" data-date-month></span>
                                    <button class="date-picker-nav" type="button" data-date-next aria-label="下个月">›</button>
                                </div>
                                <div class="date-picker-weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
                                <div class="date-picker-grid" data-date-grid role="grid"></div>
                                <button class="date-picker-clear" type="button" data-date-clear>清除日期</button>
                            </div>
                            <input type="date" id="shootDateFrom" class="date-input-native" tabindex="-1" aria-hidden="true">
                        </div>
                        <span class="date-separator">至</span>
                        <div class="date-picker" data-date-picker>
                            <button class="date-picker-trigger" type="button" data-date-trigger aria-haspopup="dialog" aria-expanded="false" aria-label="拍摄结束日期">
                                <span class="date-picker-value" data-date-value>结束日期</span>
                                <span class="date-picker-icon" aria-hidden="true"></span>
                            </button>
                            <div class="date-picker-popover" role="dialog" aria-label="选择拍摄结束日期" hidden>
                                <div class="date-picker-header">
                                    <button class="date-picker-nav" type="button" data-date-prev aria-label="上个月">‹</button>
                                    <span class="date-picker-month" data-date-month></span>
                                    <button class="date-picker-nav" type="button" data-date-next aria-label="下个月">›</button>
                                </div>
                                <div class="date-picker-weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
                                <div class="date-picker-grid" data-date-grid role="grid"></div>
                                <button class="date-picker-clear" type="button" data-date-clear>清除日期</button>
                            </div>
                            <input type="date" id="shootDateTo" class="date-input-native" tabindex="-1" aria-hidden="true">
                        </div>
                    </div>
                </div>

                <div class="filter-group" id="postDateFilterGroup">
                    <label class="filter-label">发布时间</label>
                    <div class="date-row">
                        <div class="date-picker" data-date-picker>
                            <button class="date-picker-trigger" type="button" data-date-trigger aria-haspopup="dialog" aria-expanded="false" aria-label="发布开始日期">
                                <span class="date-picker-value" data-date-value>开始日期</span>
                                <span class="date-picker-icon" aria-hidden="true"></span>
                            </button>
                            <div class="date-picker-popover" role="dialog" aria-label="选择发布开始日期" hidden>
                                <div class="date-picker-header">
                                    <button class="date-picker-nav" type="button" data-date-prev aria-label="上个月">‹</button>
                                    <span class="date-picker-month" data-date-month></span>
                                    <button class="date-picker-nav" type="button" data-date-next aria-label="下个月">›</button>
                                </div>
                                <div class="date-picker-weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
                                <div class="date-picker-grid" data-date-grid role="grid"></div>
                                <button class="date-picker-clear" type="button" data-date-clear>清除日期</button>
                            </div>
                            <input type="date" id="postDateFrom" class="date-input-native" tabindex="-1" aria-hidden="true">
                        </div>
                        <span class="date-separator">至</span>
                        <div class="date-picker" data-date-picker>
                            <button class="date-picker-trigger" type="button" data-date-trigger aria-haspopup="dialog" aria-expanded="false" aria-label="发布结束日期">
                                <span class="date-picker-value" data-date-value>结束日期</span>
                                <span class="date-picker-icon" aria-hidden="true"></span>
                            </button>
                            <div class="date-picker-popover" role="dialog" aria-label="选择发布结束日期" hidden>
                                <div class="date-picker-header">
                                    <button class="date-picker-nav" type="button" data-date-prev aria-label="上个月">‹</button>
                                    <span class="date-picker-month" data-date-month></span>
                                    <button class="date-picker-nav" type="button" data-date-next aria-label="下个月">›</button>
                                </div>
                                <div class="date-picker-weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
                                <div class="date-picker-grid" data-date-grid role="grid"></div>
                                <button class="date-picker-clear" type="button" data-date-clear>清除日期</button>
                            </div>
                            <input type="date" id="postDateTo" class="date-input-native" tabindex="-1" aria-hidden="true">
                        </div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="filter-actions">
                    <button class="btn btn-primary" id="applyFilters">筛选</button>
                    <button class="btn btn-secondary" id="resetFilters">清空</button>
                </div>
            </div>

            <div class="sidebar-bottom">
                <div class="mode-switch" role="group" aria-label="模式切换">
                    <button class="mode-btn active" id="browseModeBtn" type="button">检索浏览</button>
                    <button class="mode-btn" id="maintainModeBtn" type="button">数据维护</button>
                </div>
                <div class="maintain-tools">
                    <div class="selection-tools">
                        <button class="btn btn-secondary" id="selectVisible" type="button">选择当前结果</button>
                        <button class="btn btn-secondary" id="clearSelection" type="button">取消选择</button>
                        <button class="btn btn-danger" id="deleteSelected" type="button" disabled>删除已选</button>
                        <span class="selection-state" id="selectedState">已选择 0 条</span>
                    </div>
                    <button class="btn btn-primary" id="saveCardThemes" type="button" disabled>保存主题修改</button>
                    <button class="btn btn-secondary" id="exportStatic" type="button">导出静态浏览版</button>
                    <label class="toggle-field" title="维护模式下隐藏真实图片">
                        <input id="noImageToggle" type="checkbox">
                        <span class="toggle-track" aria-hidden="true"></span>
                        <span>无图</span>
                    </label>
                </div>
            </div>
        </div>
    </section>

    <!-- 主布局 -->
    <div class="app-layout">
        <!-- 主内容区 -->
        <main class="main-content" id="mainContent">
            <!-- 空状态 -->
                <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-state-icon">☷</div>
                <h3>暂无匹配内容</h3>
                <p>调整筛选条件查看更多影像</p>
            </div>

            <!-- 系列列表将通过 JS 动态生成 -->
            <div id="seriesList"></div>
        </main>
    </div>

    <footer class="footer">
        <div class="footer-meta">
            Last updated: 2026/08/06
        </div>
        <div class="footer-meta">
            Made with &nbsp;<span class="heart heart-pink" aria-label="粉色爱心"></span><span class="heart heart-green" aria-label="绿色爱心"></span>&nbsp; by shinoko
        </div>
    </footer>

    <!-- 图片查看模态框 -->
    <div class="modal" id="imageModal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose">✕</button>
            <button class="modal-nav modal-prev" id="modalPrev">&lsaquo;</button>
            <button class="modal-nav modal-next" id="modalNext">&rsaquo;</button>
            <div class="modal-image-container">
                <img id="modalImage" src="" alt="">
            </div>
            <div class="modal-info">
                <h3 id="modalTitle"></h3>
                <p id="modalDescription"></p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/official-data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
