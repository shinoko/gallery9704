<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALLERY9704</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <span class="nav-brand">GALLERY9704</span>
            <button class="nav-toggle" id="navToggle" title="筛选">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
                    <line x1="2" y1="3" x2="12" y2="3"/>
                    <line x1="4" y1="7" x2="10" y2="7"/>
                    <line x1="6" y1="11" x2="8" y2="11"/>
                </svg>
                筛选
            </button>
        </div>
    </nav>

    <!-- 主布局 -->
    <div class="app-layout">
        <!-- 左侧筛选面板 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">筛选条件</span>
                <span class="sidebar-count" id="resultCount">0 条</span>
                <button class="sidebar-close" id="sidebarClose" title="关闭">✕</button>
            </div>

            <div class="filter-section">
                <!-- 关键词 -->
                <div class="filter-group">
                    <label class="filter-label">关键词</label>
                    <input type="text" id="keywordSearch" class="filter-input" placeholder="输入关键词搜索...">
                </div>

                <!-- 活动主题 -->
                <div class="filter-group">
                    <label class="filter-label">活动主题</label>
                    <select id="themeFilter" class="filter-select">
                        <option value="">全部主题</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label">发布账号</label>
                    <select id="authorFilter" class="filter-select">
                        <option value="">全部账号</option>
                    </select>
                </div>

                <!-- 拍摄时间 -->
                <div class="filter-group">
                    <label class="filter-label">拍摄时间</label>
                    <div class="date-row">
                        <input type="date" id="dateFrom" class="filter-input" placeholder="起始日期">
                        <span class="date-separator">至</span>
                        <input type="date" id="dateTo" class="filter-input" placeholder="结束日期">
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="filter-actions">
                    <button class="btn btn-primary" id="applyFilters">应用筛选</button>
                    <button class="btn btn-secondary" id="resetFilters">清空筛选</button>
                </div>
            </div>

            <div class="sidebar-bottom">
                <div class="mode-switch" role="group" aria-label="模式切换">
                    <button class="mode-btn active" id="browseModeBtn" type="button">检索浏览</button>
                    <button class="mode-btn" id="maintainModeBtn" type="button">数据维护</button>
                </div>
                <div class="maintain-tools">
                    <div class="selection-tools">
                        <button class="btn btn-secondary" id="selectVisible" type="button">选择当前结果</button>
                        <button class="btn btn-secondary" id="clearSelection" type="button">取消选择</button>
                        <button class="btn btn-danger" id="deleteSelected" type="button" disabled>删除已选</button>
                        <span class="dirty-state" id="selectedState">已选择 0 条</span>
                    </div>
                    <button class="btn btn-secondary" id="saveMaintenance" type="button">保存维护数据</button>
                    <button class="btn btn-secondary" id="exportMaintenance" type="button">导出 JSON</button>
                    <button class="btn btn-secondary" id="exportStatic" type="button">导出静态浏览版</button>
                    <span class="dirty-state" id="dirtyState">已同步</span>
                </div>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content" id="mainContent">
            <!-- 空状态 -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-state-icon">☷</div>
                <h3>暂无匹配内容</h3>
                <p>调整筛选条件查看更多微博影像</p>
            </div>

            <!-- 系列列表将通过 JS 动态生成 -->
            <div id="seriesList"></div>
        </main>
    </div>

    <footer class="footer">
        <div class="footer-meta">
            Made with &nbsp;<span class="heart heart-pink" aria-label="粉色爱心"></span><span class="heart heart-green" aria-label="绿色爱心"></span>&nbsp; by shinoko
        </div>
    </footer>

    <!-- 图片查看模态框 -->
    <div class="modal" id="imageModal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose">✕</button>
            <button class="modal-nav modal-prev" id="modalPrev">&lsaquo;</button>
            <button class="modal-nav modal-next" id="modalNext">&rsaquo;</button>
            <div class="modal-image-container">
                <img id="modalImage" src="" alt="">
            </div>
            <div class="modal-info">
                <h3 id="modalTitle"></h3>
                <p id="modalDescription"></p>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
